<div
  #canvasContainer
  class="telemetry-3d-wrap"
  (pointermove)="onPointerMove($event)"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp()"
  (pointerleave)="onPointerUp()"
  title="Monitoreo de Clúster 3D: Arrastra libremente para rotar en cualquier ángulo con inercia"
>
  <!-- Canvas WebGL Three.js -->
  <canvas #webglCanvas class="telemetry-webgl-canvas"></canvas>

  <!-- HUD Superior Limpio (Sin métricas redundantes ni FPS) -->
  <div class="hud-top-bar">
    <div class="hud-pill-status">
      <span class="hud-beacon-dot"></span>
      <span class="font-mono hud-pill-text">RED DE CLÚSTER · MONITOREO ACTIVO</span>
    </div>
  </div>

  <!-- Barra de Controles 3D Inferior -->
  <div class="hud-bottom-bar">
    <div class="hud-controls-group">
      <button
        type="button"
        class="hud-btn-action"
        [class.btn-active]="isPulseActive()"
        (click)="triggerPulse()"
        title="Disparar comprobación de conectividad a todos los nodos del clúster"
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span>Sondear Red</span>
      </button>

      <button
        type="button"
        class="hud-btn-action"
        [class.btn-active]="isAutoRotating()"
        (click)="toggleAutoRotation()"
        [title]="isAutoRotating() ? 'Pausar rotación automática' : 'Reanudar rotación automática'"
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>{{ isAutoRotating() ? 'Rotación: ON' : 'Rotación: OFF' }}</span>
      </button>
    </div>

    <div class="hud-interaction-hint font-mono">
      <span>Arrastra con inercia</span>
      <span class="hint-arrow">↔</span>
    </div>
  </div>
</div>
