# Variables de entorno NO hardcodeadas
spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployops_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}