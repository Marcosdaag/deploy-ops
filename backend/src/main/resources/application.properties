spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployops_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://deployopsapp.vercel.app,https://deploy-ops-rho.vercel.app,http://localhost:4200}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.jwt.secret=${JWT_SECRET:deployops-super-secure-secret-key-for-jwt-signing-2026-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:alerts@deployops.io}
app.dashboard.url=${DASHBOARD_URL:https://deployopsapp.vercel.app/}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
