spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployops_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://deploy-ops-rho.vercel.app,http://localhost:4200,*}
app.jwt.secret=${JWT_SECRET:deployops-super-secure-secret-key-for-jwt-signing-2026-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
