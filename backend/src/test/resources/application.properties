spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:4200
app.google.client-id=
app.jwt.secret=deployops-super-secure-secret-key-for-jwt-signing-2026-production
app.jwt.expiration-ms=86400000
app.mail.enabled=false
app.mail.from=alerts@deployops.io
app.dashboard.url=https://deployopsapp.vercel.app/
app.redis.enabled=false
management.health.redis.enabled=false
app.status-cache.ttl-seconds=60
app.rabbitmq.enabled=false
management.health.rabbit.enabled=false
app.webhook.encryption-key=test-secret-key-deployops-32-bytes!
management.endpoints.web.exposure.include=health,info
app.monitoring.ssl-check-interval-hours=24
app.monitoring.ssl-alert-cooldown-hours=24
